[project]
name = "tensorforms"
version = "0.1.0"
description = "Calculus of tensor-valued forms with four operators"
requires-python = ">=3.9"
dependencies = ["sympy>=1.12", "numpy>=1.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tensorforms*"]
